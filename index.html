<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌈 ผจญภัยอาณาจักรภาษาไทย</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fff0f8,#e5f9ff,#fffbdc);color:#263238}.wrap{max-width:1050px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#7c4dff,#00bcd4);color:white;padding:25px;border-radius:24px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}.card{background:#fff;padding:20px;border-radius:20px;margin-top:16px;box-shadow:0 7px 25px #0001}.start{display:flex;gap:10px}.start input,.chat input{flex:1;padding:13px;border:2px solid #ddd;border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#ff4081;color:#fff;font-weight:bold;cursor:pointer}.btn:hover{filter:brightness(.92)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{text-align:center;background:#f3f5ff;padding:10px;border-radius:14px}.stat b{display:block;font-size:24px}.bar{height:10px;background:#eee;border-radius:10px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4081,#7c4dff,#00bcd4);width:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab{background:#fff;color:#333;border:2px solid #ddd}.tab.active{background:#673ab7;color:#fff}.hidden{display:none!important}.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.zone{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px;border:3px solid #eee;border-radius:18px;background:#fff9ff}.zone.done{border-color:#63c76a;background:#f1fff1}.emoji{font-size:30px}.small{font-size:13px;color:#687}.quiz{border:4px solid #7c4dff}.qmeta{color:#673ab7;font-weight:bold}.question{font-size:21px;font-weight:bold;margin:15px 0}.options{display:grid;gap:9px}.option{text-align:left;padding:14px;border:2px solid #ddd;background:white;border-radius:12px;cursor:pointer}.option:hover{border-color:#7c4dff;background:#f5f0ff}.option:disabled{cursor:not-allowed}.good{color:#188b35;font-weight:bold}.bad{color:#d32f2f;font-weight:bold}.feedback{min-height:28px;margin-top:12px}.magic{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.cell{text-align:center;padding:10px;border-radius:12px;border:2px solid #ddd}.cell b{display:block;font-size:28px}.กลาง{background:#ffc9df}.สูง{background:#caffcf}.ต่ำคู่{background:#ffd09b}.ต่ำเดี่ยว{background:#fff36a}.chatbox{height:240px;overflow:auto;background:#f6f6f6;padding:10px;border-radius:12px}.msg{background:white;padding:8px;border-radius:9px;margin:5px}.chat{display:flex;gap:8px;margin-top:8px}.rankrow{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee}@media(max-width:650px){.start{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.zone{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<header><h1>🌈 ผจญภัยอาณาจักรภาษาไทย</h1><div>เกมภาษาไทยระดับ ป.4–ป.6 • 15 ด่าน • ด่านละ 5 ข้อ</div></header>
<section class="card"><h2>🎮 เริ่มเกม</h2><div class="start"><input id="name" placeholder="พิมพ์ชื่อผู้เล่น"><button class="btn" id="start">เริ่มการผจญภัย</button></div><div id="hello"></div><div class="stats"><div class="stat">⭐ XP<b id="score">0</b></div><div class="stat">❤️ ชีวิต<b id="life">5</b></div><div class="stat">🏆 ด่าน<b id="done">0/15</b></div><div class="stat">🎖️ ระดับ<b id="level">นักสำรวจ</b></div></div><div class="bar"><i id="progress"></i></div></section>
<div class="tabs"><button class="btn tab active" data-open="map">🗺️ แผนที่</button><button class="btn tab" data-open="magic">✨ ตารางความรู้</button><button class="btn tab" data-open="chat">💬 แชต</button><button class="btn tab" data-open="rank">🏆 อันดับ</button></div>
<section id="map" class="card page"><h2>🗺️ เลือกด่าน</h2><div id="zones" class="zones"></div></section>

<section id="chat" class="card page hidden"><h2>💬 ห้องแชต</h2><div id="messages" class="chatbox"><div class="msg">🤖 ผู้ช่วย: พร้อมเรียนภาษาไทยหรือยัง?</div></div><form id="chatForm" class="chat"><input id="chatInput" placeholder="พิมพ์ข้อความ..."><button class="btn">ส่ง</button></form></section>
<section id="rank" class="card page hidden"><h2>🏆 ตารางคะแนน</h2><div id="ranking"></div></section>
<section id="quiz" class="card quiz hidden"><div class="qmeta" id="qmeta"></div><h2 id="qtitle"></h2><div class="question" id="qtext"></div><div id="options" class="options"></div><div id="feedback" class="feedback"></div><button class="btn" id="back">กลับแผนที่</button></section>
</div><script>

[['ก ข ค ง อยู่ในวรรคใด',['วรรคกะ','วรรคจะ','วรรคฏะ','วรรคตะ']],['จ ฉ ช อยู่ในวรรคใด',['วรรคจะ','วรรคกะ','วรรคปะ','เศษวรรค']],['ฏ ฐ ฑ อยู่ในวรรคใด',['วรรคฏะ','วรรคกะ','วรรคตะ','วรรคปะ']],['ต ถ ท อยู่ในวรรคใด',['วรรคตะ','วรรคจะ','วรรคฏะ','วรรคกะ']],['ป ผ พ อยู่ในวรรคใด',['วรรคปะ','วรรคตะ','วรรคจะ','เศษวรรค']]],
[['เสียง ป เกิดเด่นที่ใด',['ริมฝีปาก','ปุ่มเหงือก','เพดานอ่อน','คอ']],['เสียง ต เกิดเด่นที่ใด',['ปุ่มเหงือก','ริมฝีปาก','เพดานอ่อน','คอ']],['เสียง ก เกิดเด่นที่ใด',['เพดานอ่อน','ริมฝีปาก','ปุ่มเหงือก','คอ']],['เสียง จ เกิดเด่นที่ใด',['เพดานแข็ง','ริมฝีปาก','ปุ่มเหงือก','คอ']],['เสียง ม ใช้อวัยวะใดเด่น',['ริมฝีปาก','ลิ้นไก่','ปุ่มเหงือก','เพดานแข็ง']]],
[['กลุ่มเศษวรรคตามตารางเกมคือ',['ย ร ล ว','ก ข ค','จ ฉ ช','ต ถ ท']],['“ยาย” มีตัวใดในกลุ่มนี้',['ย','ก','ต','พ']],['“ลม” มีตัวใดในกลุ่มนี้',['ล','ก','ม','น']],['“วัว” มีตัวใดในกลุ่มนี้',['ว','ก','อ','ส']],['ข้อใดไม่อยู่ในกลุ่ม ย ร ล ว',['ก','ย','ร','ว']]],
[['ตัวสะกดตรงมาตรากงคือ',['ง','น','ม','ย']],['ตัวสะกดตรงมาตรากมคือ',['ม','น','ง','บ']],['ตัวสะกดตรงมาตรากนคือ',['น','ง','ม','ย']],['ตัวสะกดตรงมาตรากบคือ',['บ','ม','น','ง']],['ตัวสะกดตรงมาตรากกคือ',['ก','ข','ค','ง']]],
[['ตัวสะกดไม่ตรงมาตรากดคือ',['จ','น','ม','ง']],['ตัวสะกดไม่ตรงมาตรากบคือ',['พ','น','ม','ง']],['ตัวสะกดไม่ตรงมาตรากนคือ',['ร','ม','ง','บ']],['ตัวสะกดไม่ตรงมาตรากกคือ',['ข','น','ม','ง']],['ตัวสะกดไม่ตรงมาตรากบคือ',['ฟ','น','ม','ง']]],

var state={name:'',score:0,life:5,done:[],ans:{}};var stage=0,q=0;
function $(x){return document.getElementById(x)}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function save(){try{localStorage.setItem('thaiAdventure',JSON.stringify(state))}catch(e){}}function load(){try{var x=JSON.parse(localStorage.getItem('thaiAdventure'));if(x)state=x}catch(e){}}
function render(){ $('score').textContent=state.score;$('life').textContent=state.life;$('done').textContent=state.done.length+'/15';$('progress').style.width=state.done.length/15*100+'%';$('level').textContent=state.score>=600?'👑 จอมปราชญ์':state.score>=400?'🛡️ ผู้พิทักษ์':state.score>=200?'⭐ นักวิเคราะห์':'🌱 นักสำรวจ';renderZones();renderMagic();renderRank()}
function renderZones(){var z=$('zones');z.innerHTML='';topics.forEach(function(t,i){var d=document.createElement('div');d.className='zone'+(state.done.indexOf(i)>=0?' done':'');d.innerHTML='<div><span class="emoji">'+t[0]+'</span><h3>ด่าน '+(i+1)+' '+t[1]+'</h3><div class="small">5 ข้อ • '+(i<5?'พื้นฐาน':i<10?'ท้าทาย':'นักวิเคราะห์')+'</div></div><button class="btn">เริ่มด่าน</button>';d.querySelector('button').onclick=function(){openQuiz(i)};z.appendChild(d)})}
function renderMagic(){var x=[['ก','กลาง'],['จ','กลาง'],['ต','กลาง'],['บ','กลาง'],['ข','สูง'],['ฉ','สูง'],['ถ','สูง'],['ผ','สูง'],['ค','ต่ำคู่'],['ช','ต่ำคู่'],['ท','ต่ำคู่'],['พ','ต่ำคู่'],['ง','ต่ำเดี่ยว'],['น','ต่ำเดี่ยว'],['ม','ต่ำเดี่ยว'],['ย','ต่ำเดี่ยว'],['ว','ต่ำเดี่ยว']];$('magicGrid').innerHTML='';x.forEach(function(a){var d=document.createElement('div');d.className='cell '+a[1];d.innerHTML='<b>'+a[0]+'</b><small>'+a[1]+'</small>';$('magicGrid').appendChild(d)})}

function start(){var n=$('name').value.trim();if(!n){alert('กรุณาพิมพ์ชื่อก่อนเริ่มเกม');$('name').focus();return}state.name=n;$('hello').textContent='🎮 ยินดีต้อนรับ '+n+'!';save();render()}
function openQuiz(i){if(!state.name){alert('กรุณาพิมพ์ชื่อก่อนเริ่มเกม');return}stage=i;q=0;$('quiz').classList.remove('hidden');showQuestion();$('quiz').scrollIntoView({behavior:'smooth'})}
function showQuestion(){var it=bank[stage][q],correct=it[1][0],opts=[correct,it[1][1],it[1][2],it[1][3]];$('qmeta').textContent=topics[stage][1]+' • ข้อ '+(q+1)+'/5';$('qtitle').textContent='ด่าน '+(stage+1);$('qtext').textContent=it[0];$('feedback').textContent='';$('options').innerHTML='';opts.forEach(function(o,i){var b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=function(){answer(i===0)};$('options').appendChild(b)})}
function answer(ok){document.querySelectorAll('.option').forEach(function(b){b.disabled=true});if(ok){var key=stage+'-'+q;if(!state.ans[key]){state.ans[key]=1;state.score+=10}$('feedback').innerHTML='<span class="good">✅ ถูกต้อง! +10 XP</span>';if(q===4){if(state.done.indexOf(stage)<0)state.done.push(stage);save();render();setTimeout(function(){$('qtext').textContent=stage===14?'🎉 พิชิตครบทั้ง 15 ด่านแล้ว!':'🎉 ผ่านด่าน '+(stage+1)+' สำเร็จ!';$('options').innerHTML=''},500)}else{save();render();setTimeout(function(){q++;showQuestion()},500)}}else{state.life=Math.max(0,state.life-1);$('feedback').innerHTML='<span class="bad">❌ ยังไม่ถูก ลองอ่านบทเรียนแล้วตอบใหม่</span>';save();render()}}
